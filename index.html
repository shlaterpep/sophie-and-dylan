<style>
/* Layout: a portrait card matching the printed save-the-date. Keyline border, heading at the top, names, drawing, date and place stacked on one centre line, footer text sitting on the bottom border. */
:root {
  --paper: #fbe9e1;
  --ink: #d82c24;
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .75  0 0 0 0 .4  0 0 0 0 .35  0 0 0 .09 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  --display: "Cormorant", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "Jost", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
h1, p { margin: 0; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image: var(--grain);
  color: var(--ink);
  font-family: var(--display);
  font-weight: 300;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

.card {
  position: relative;
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  aspect-ratio: 1188 / 1680;
  min-height: calc(100vh - 32px);
  min-height: calc(100svh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: clamp(30px, 9vw, 60px) 16px clamp(40px, 8vw, 64px);
}

.card::before { content: ""; position: absolute; inset: 0; border: 1.5px solid var(--ink); border-bottom: 0; pointer-events: none; }
.top { font-size: clamp(1.4rem, 5.4vw, 2.2rem); letter-spacing: 0.01em; font-weight: 300; line-height: 1; }
.top em { font-style: italic; }

/* Everything between heading and footer is spread over the card height, in the same proportions as the print. */
.hero { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; }
.sp { display: block; min-height: 12px; }
.s1 { flex: 2; }
.s2 { flex: 2; }
.s3 { flex: 0.8; }
.s4 { flex: 1.8; }

.mark { -webkit-tap-highlight-color: transparent; touch-action: manipulation; width: 58%; max-width: 380px; line-height: 0; cursor: pointer; transition: transform .4s cubic-bezier(.3,1.6,.5,1); }
.mark:hover { transform: rotate(-1.5deg) scale(1.015); }
.logo { display: block; width: 100%; height: auto; }

.art { display: block; width: 36%; min-width: 110px; max-width: 230px; height: auto; color: var(--ink); }

.when { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.date { font-size: clamp(1.7rem, 7vw, 2.9rem); display: flex; align-items: center; gap: 0.5em; line-height: 1; font-variant-numeric: lining-nums; }
.date i { display: block; width: clamp(40px, 12vw, 76px); height: 1.5px; background: var(--ink); }
.place { font-size: clamp(1.4rem, 5.6vw, 2.2rem); line-height: 1.1; }

.btn { margin-top: 14px; font-family: var(--body); font-weight: 400; font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink); background: transparent; border: 1.5px solid var(--ink); padding: 13px 20px; cursor: pointer; transition: background .2s, color .2s; }
.btn:hover { background: var(--ink); color: var(--paper); }

/* Footer: the bottom border is drawn as two lines either side of the text, so nothing needs a background behind it */
.foot { position: absolute; left: 0; right: 0; bottom: 0; transform: translateY(50%); display: flex; align-items: center; gap: 14px; font-style: italic; font-size: clamp(1rem, 3.6vw, 1.25rem); line-height: 1.3; white-space: nowrap; }
.foot::before, .foot::after { content: ""; flex: 1; height: 1.5px; background: var(--ink); }
.foot span { flex: none; }

/* Bottom sheet */
.sheet { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
.sheet[hidden] { display: none; }
.backdrop { position: absolute; inset: 0; background: rgba(70, 20, 16, .38); opacity: 0; transition: opacity .25s ease; }
.panel { position: relative; width: 100%; max-width: 560px; background-color: var(--paper); background-image: var(--grain); border: 1.5px solid var(--ink); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; text-align: center; transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); outline: none; }
.sheet.open .backdrop { opacity: 1; }
.sheet.open .panel { transform: translateY(0); }
.grab { align-self: center; width: 44px; height: 4px; border-radius: 2px; background: var(--ink); opacity: .45; margin-bottom: 14px; }
.sheet-title { font-family: var(--body); font-weight: 400; font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; padding-bottom: 12px; }
.opt { display: block; width: 100%; font-family: var(--display); font-weight: 400; font-size: 1.7rem; line-height: 1.2; color: var(--ink); text-decoration: none; background: transparent; border: 0; border-top: 1px solid rgba(216, 44, 36, .35); padding: 16px 8px; cursor: pointer; transition: background .2s, color .2s; }
.opt:hover { background: var(--ink); color: var(--paper); }
.opt:focus-visible { outline: 2px solid var(--ink); outline-offset: -4px; }
.opt.cancel { font-family: var(--body); font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; }

/* Intro: a soft staggered fade. */
.top, .mark, .art, .when, .foot { animation: fade .8s ease backwards; }
.mark { animation-delay: .15s; }
.art { animation-delay: .3s; }
.when { animation-delay: .45s; }
.foot { animation-delay: .6s; }
@keyframes fade { from { opacity: 0; } }

.heart { position: fixed; z-index: 150; pointer-events: none; font-size: 1.1rem; color: var(--ink); animation: pop 1.2s cubic-bezier(.2,.8,.3,1) forwards; }
@keyframes pop { 0% { opacity: 1; transform: translate(0,0) scale(.4) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(var(--rot)); } }

.heart.still { animation: stillfade 1.3s ease forwards; }
@keyframes stillfade { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .btn, .opt, .backdrop, .panel { transition: none; }
  .mark { transition: none; }
  .mark:hover { transform: none; }
}
</style>

    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !sheet.hidden) closeSheet(); });

    document.getElementById('cal-apple').addEventListener('click', function () {
      var ics = [
        'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Sophie and Dylan//Wedding//EN', 'CALSCALE:GREGORIAN',
        'BEGIN:VEVENT',
        'UID:sophie-dylan-wedding-20270828@wedding',
        'DTSTAMP:20261020T000000Z',
        'DTSTART;VALUE=DATE:20270828',
        'DTEND;VALUE=DATE:20270829',
        'SUMMARY:Sophie & Dylan\'s Wedding',
        'LOCATION:Mountain View\\, Kilkenny',
        'DESCRIPTION:Invitations to follow.',
        'END:VEVENT', 'END:VCALENDAR'
      ].join('\r\n');
      var blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sophie-and-dylan-wedding.ics';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      closeSheet();
    });

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { var catAnim = document.getElementById('cat-anim'); if (catAnim) catAnim.remove(); }
    var mark = document.querySelector('.mark');
    mark.addEventListener('click', function (ev) {
      var box = mark.getBoundingClientRect();
      var x = ev.clientX || box.left + box.width / 2;
      var y = ev.clientY || box.top + box.height / 2;
      var n = reduce ? 9 : 22;
      for (var i = 0; i < n; i++) {
        var h = document.createElement('span');
        h.className = reduce ? 'heart still' : 'heart';
        h.textContent = i % 3 === 0 ? '\u2665' : '\u2022';
        var ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 120;
        if (reduce) {
          h.style.left = (x + Math.cos(ang) * dist * 0.6) + 'px';
          h.style.top = (y + Math.sin(ang) * dist * 0.6) + 'px';
        } else {
          h.style.left = x + 'px'; h.style.top = y + 'px';
          h.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
          h.style.setProperty('--dy', Math.sin(ang) * dist - 40 + 'px');
          h.style.setProperty('--rot', (Math.random() * 120 - 60) + 'deg');
        }
        document.body.appendChild(h);
        setTimeout(function (el) { el.remove(); }.bind(null, h), 1400);
      }
    });
  } catch (e) {}
})();
</script>
</body>
